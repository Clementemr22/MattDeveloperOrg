<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matt Developer Org</title>

    <style>
        :root {
            --bg: #1e1f22;
            --surface: #2b2d31;
            --surface-hover: #353841;
            --accent: #4ea1ff;
            --text: #f2f3f5;
            --text-secondary: #b5bac1;
            --border: #3d4048;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: "Segoe UI", Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
        }

        header {
            text-align: center;
            padding: 3rem 1rem;
            border-bottom: 1px solid var(--border);
            background: var(--surface);
        }

        header h1 {
            margin: 0;
            color: var(--accent);
            font-size: 2.8rem;
        }

        header p {
            color: var(--text-secondary);
            margin-top: 0.5rem;
        }

        main {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 1.5rem;
            box-shadow: 0 6px 24px rgba(0, 0, 0, 0.25);
        }

        h2 {
            margin-top: 0;
            color: var(--accent);
        }

        .survey-container {
            display: flex;
            justify-content: center;
            margin-top: 1rem;
        }

        iframe {
            border: none;
            border-radius: 12px;
            background: white;
            max-width: 100%;
        }

        footer {
            text-align: center;
            padding: 2rem 1rem;
            color: var(--text-secondary);
        }

        @media (max-width: 768px) {
            iframe {
                width: 100%;
                height: 700px;
            }

            header h1 {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>Matt Developer Org</h1>
        <p>Testing ground for embedded surveys, integrations, and web development experiments.</p>
    </header>

    <main>
        <section class="card">
            <h2>Language Selection Survey</h2>
            <p>
                This page is used for testing embedded Alchemer surveys and other web development projects.
            </p>

            <div class="survey-container">
                <iframe
                    src="https://survey.mattdeveloperorg.com/s3/Language-Select"
                    width="700"
                    height="500"
                    style="overflow:hidden;">
                </iframe>
            </div>
        </section>
    </main>

    <footer>
        © 2026 Matt Developer Org
    </footer>

</body>
</html>
