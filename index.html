<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matt Developer Org</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f7fa;
            color: #333;
            padding: 30px;
        }

        .container {
            max-width: 1200px;
            margin: auto;
        }

        h1 {
            margin-bottom: 10px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,.08);
        }

        .card h2 {
            margin-bottom: 15px;
        }

        .status-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 15px;
        }

        .status-item {
            padding: 15px;
            border-radius: 8px;
            background: #f8f9fb;
        }

        .status-value {
            margin-top: 8px;
            font-weight: bold;
        }

        .green {
            color: #16a34a;
        }

        .red {
            color: #dc2626;
        }

        .blue {
            color: #2563eb;
        }

        .button-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 10px;
        }

        button {
            padding: 12px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background: #2563eb;
            color: white;
            font-size: 14px;
        }

        button:hover {
            background: #1d4ed8;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            margin-bottom: 10px;
        }

        #eventHistory {
            max-height: 300px;
            overflow-y: auto;
        }

        .event-entry {
            padding: 10px;
            border-bottom: 1px solid #eee;
            font-family: monospace;
        }

        .timestamp {
            color: #666;
            margin-right: 10px;
        }

        .last-event {
            margin-top: 10px;
            font-weight: bold;
            color: #2563eb;
        }
    </style>

    <!-- Alchemer SDK -->
    <script>
        (function initApptentiveSDK() {
            var ApptentiveSDK = window.ApptentiveSDK = window.ApptentiveSDK || [];

            if (!ApptentiveSDK.version) {
                if (!ApptentiveSDK.loaded) {
                    ApptentiveSDK.loaded = true;

                    ApptentiveSDK.methods = [
                        "buildDevice",
                        "createConversation",
                        "createMessage",
                        "engage",
                        "getSegments",
                        "identifyPerson",
                        "setOption",
                        "setPageName",
                        "showInteraction",
                        "showMessageCenter",
                        "updatePerson"
                    ];

                    ApptentiveSDK.factory = function (t) {
                        return function () {
                            var args = Array.prototype.slice.call(arguments);
                            args.unshift(t);
                            ApptentiveSDK.push(args);
                            return ApptentiveSDK;
                        };
                    };

                    for (var i = 0; i < ApptentiveSDK.methods.length; i++) {
                        var method = ApptentiveSDK.methods[i];
                        ApptentiveSDK[method] = ApptentiveSDK.factory(method);
                    }

                    ApptentiveSDK.LOADER_VERSION = "1.0.0";
                }
            }
        })();
    </script>

    <script async src="https://sdk.apptentive.com/v1/apps/6ac6691ce871ff006e608435/websdk"></script>

</head>

<body>

<div class="container">

    <h1>🧪 Matt Developer Org</h1>
    <p class="subtitle">
        Digital/Survey testing
    </p>

    <div class="card">
        <h2>SDK Status</h2>

        <div class="status-grid">

            <div class="status-item">
                SDK Loaded
                <div id="sdkLoaded" class="status-value red">
                    Checking...
                </div>
            </div>

            <div class="status-item">
                Conversation
                <div id="conversationStatus" class="status-value red">
                    Not Created
                </div>
            </div>

            <div class="status-item">
                Last Event Sent
                <div id="lastEvent" class="status-value blue">
                    None
                </div>
            </div>

            <div class="status-item">
                Total Events
                <div id="eventCount" class="status-value">
                    0
                </div>
            </div>

        </div>
    </div>

    <div class="card">
        <h2>Quick Test Events</h2>

        <div class="button-grid">

            <button onclick="sendEvent('site-loaded')">
                Site Loaded
            </button>

            <button onclick="sendEvent('test-survey')">
                Test Survey
            </button>

            <button onclick="sendEvent('test-prompt')">
                Test Prompt
            </button>

            <button onclick="sendEvent('test-love-dialog')">
                Love Dialog
            </button>

            <button onclick="sendEvent('checkout-complete')">
                Checkout Complete
            </button>

            <button onclick="sendEvent('support-request')">
                Support Request
            </button>

        </div>
    </div>

    <div class="card">
        <h2>Custom Event</h2>

        <input
            id="customEvent"
            type="text"
            placeholder="Enter Event Name">

        <button onclick="sendCustomEvent()">
            Send Custom Event
        </button>
    </div>

    <div class="card">
        <h2>SDK Tools</h2>

        <div class="button-grid">

            <button onclick="runDoctor()">
                Run Doctor
            </button>

            <button onclick="openMessageCenter()">
                Open Message Center
            </button>

            <button onclick="clearHistory()">
                Clear Event History
            </button>

        </div>
    </div>

    <div class="card">
        <h2>Event History</h2>

        <div id="eventHistory">
            <div class="event-entry">
                Waiting for events...
            </div>
        </div>
    </div>

</div>

<script>

let eventCounter = 0;

document.addEventListener("DOMContentLoaded", function () {

    createConversation();

    setTimeout(() => {

        document.getElementById("sdkLoaded").innerHTML =
            '<span class="green">✓ Loaded</span>';

    }, 2000);

});

function createConversation() {

    try {

        ApptentiveSDK.createConversation();

        document.getElementById("conversationStatus").innerHTML =
            '<span class="green">✓ Active</span>';

        addHistory("SYSTEM", "Conversation Created");

    } catch (e) {

        document.getElementById("conversationStatus").innerHTML =
            '<span class="red">✗ Failed</span>';

        console.error(e);
    }
}

function sendEvent(eventName) {

    try {

        ApptentiveSDK.engage(eventName);

        eventCounter++;

        document.getElementById("lastEvent").textContent =
            eventName;

        document.getElementById("eventCount").textContent =
            eventCounter;

        addHistory("EVENT", eventName);

        console.log("Event Sent:", eventName);

    } catch (e) {

        console.error(e);

        addHistory("ERROR", e.message);
    }
}

    const eventName =
        document.getElementById("customEvent").value.trim();

    if (!eventName) {
        alert("Enter an event name.");
        return;
    }
