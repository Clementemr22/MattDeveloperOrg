<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Testing Website - Survey Embed Testing</title>

    <link rel="stylesheet" href="./styles.css">

    <script src="https://api.alchemer.com/head/surveyjsscript"></script>
</head>

<body>
    <div class="container">

        <nav class="card">
            <a href="./index.html">SDK Testing</a>
            |
            <a href="./survey-embed.html">Survey Embed Testing</a>
        </nav>

        <header>
            <h1>Testing Website</h1>

            <p class="subtitle">
                Survey Embed Testing
            </p>
        </header>

        <main>

            <section class="card">
                <h2>Embed Area</h2>

                <div id="surveyContainer">
                    Survey will load here.
                </div>
                <!-- This embed code may be restricted to use on a single domain, see documentation at: https://help.alchemer.com/help/iframe-embed#limit-permitted-domains-for-embeds -->
<!-- This embed code may be restricted to use on a single domain, see documentation at: https://help.alchemer.com/help/iframe-embed#limit-permitted-domains-for-embeds -->
<iframe src="https://survey.alchemer.com/s3/8795209/CSAT-5-Point-Rating" frameborder="0" width="100%" height="600" style="overflow:hidden"></iframe>
            <script>
window.addEventListener('message', function(event) {
  let iframeElem = document.querySelector('#alchemer-embed');

  if (iframeElem && event.data.caller === 'Alchemer') {
    iframeElem.height = event.data.payload;
  }
});
</script>
            </section>

            <section class="card">
                <h2>Activity Log</h2>

                <div id="eventHistory">
                    <div class="event-entry">
                        Waiting for survey...
                    </div>
                </div>
            </section>
        </main>
    </div>

   
</body>
</html>
